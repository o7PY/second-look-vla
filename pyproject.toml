[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-look"
version = "0.1.0"
description = "Second Look: detect, check, retry for SmolVLA on LIBERO-Goal (DeltaDINO scene-change gate)"
requires-python = ">=3.12"
# Dependencies are pinned in requirements.txt (install that first); license: to be chosen by the author.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
