<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How DeltaDINO sees a change</title>
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--fg:#14171f;--mut:#5b6472;--line:#d7dbe3;--acc:#2563eb;--ok:#1a8f3c;--bad:#d1332f;--arm:#f59e0b;--stat:#5b7bd6;--gt:#16a34a;--grid:#00000040;--chip:#eef1f6;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#161b24;--fg:#e8ebf2;--mut:#99a3b4;--line:#2a3140;--acc:#6ea0ff;--ok:#3fbf63;--bad:#ff6b66;--arm:#ffb13d;--stat:#7c9cf0;--gt:#3ddc6e;--grid:#ffffff40;--chip:#1e2531}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#161b24;--fg:#e8ebf2;--mut:#99a3b4;--line:#2a3140;--acc:#6ea0ff;--ok:#3fbf63;--bad:#ff6b66;--arm:#ffb13d;--stat:#7c9cf0;--gt:#3ddc6e;--grid:#ffffff40;--chip:#1e2531}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0}
.sub{color:var(--mut);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:16px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.layout>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{width:100%;aspect-ratio:880/470;display:block;border-radius:8px}
.side h2{font-size:18px;margin:0 0 4px}
.side .n{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.side p{margin:6px 0 10px}
.real{max-width:100%;background:var(--chip);border-radius:8px;padding:8px 10px;font:12.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.real b{font-family:system-ui,sans-serif;font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:0 6px}
.dots button{width:30px;padding:4px 0;text-align:center}
.grp{display:flex;gap:4px;align-items:center;color:var(--mut);font-size:13px}
.spacer{flex:1}
.foot{color:var(--mut);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>How DeltaDINO sees a change</h1>
    <div class="sub" id="sub"></div></div>
    <button id="theme" title="Light / dark">Theme</button>
  </header>
  <div class="layout">
    <div class="card"><canvas id="stage"></canvas>
      <div class="controls">
        <button id="back">&larr; Back</button>
        <div class="dots" id="dots"></div>
        <button id="next">Next &rarr;</button>
        <button id="auto">Autoplay: off</button>
        <button id="replay">Replay</button>
      </div>
      <div class="controls" id="patchrow" style="margin-top:8px"><span class="grp">Patch: </span></div>
    </div>
    <div class="card side"><div class="n" id="sn"></div><h2 id="st"></h2><p id="sp"></p><div class="real" id="sr"></div></div>
  </div>
  <div class="foot">Every number and picture comes from one real pair (tensors exported from the trained checkpoints). Model C masks the static background region only (the arm stays visible); seed 0. The features, change map and loss shown are those of model C.</div>
</div>

  real() { const m = M(); return `<b>pooling, model ${S.model}</b>kept patches n = ${m.n_kept}\nmax z over kept = ${g(m.max_z_kept, 3)}\nlog-sum-exp(r z) = ${g(m.lse, 3)}\ns = (lse - log n) / r = ${g(m.s, 3)}\nsl.eval stored score = ${g(m.eval_score, 3)}  (diff ${Math.abs(m.s - m.eval_score).toExponential(1)})\nP = sigma(s) = ${g(m.P, 5)}\n\n<b>threshold: F1-max on val (label_v2), seed 0</b>logit ${g(m.threshold_logit, 4)}  ->  P ${g(m.threshold_P, 4)}\ns ${m.s >= m.threshold_logit ? '>=' : '<'} threshold  ->  ${m.verdict}\ntrue label CHANGED  ->  ${m.verdict === 'CHANGED' ? 'correct' : 'wrong'}`; }},
 {title: 'How it was trained: the loss', text: 'Training minimises  image BCE + 0.5 × patch BCE  against labels the simulator measured (image: changed or not; patches: where the changed object is). Masked patches do not count.', dur: 4200,
  draw(t) { const m = M(), s = 200, y = 80, xs = [20, 250, 480];
    const a = [ease(seg(t, 0, .3)), ease(seg(t, .2, .5)), ease(seg(t, .4, .7))];
    img(IM.set, xs[0], y, s, .9 * a[0]); ctx.globalAlpha = a[0]; grid(xs[0], y, s, 1, C.grid); gtCells(xs[0], y, s, a[0]); txt('patch labels', xs[0] + s / 2, y - 18, {a: 'center', w: 700, c: C.mut, al: a[0]}); txt('green = changed object', xs[0] + s / 2, y + s + 16, {a: 'center', s: 11, c: C.mut, al: a[0]});
    img(IM.set, xs[1], y, s, .55 * a[1]); heat(m.z.map(r => r.map(sig)), xs[1], y, s, {skip: m.mask_fed, al: a[1]}); txt('model: σ(z)', xs[1] + s / 2, y - 18, {a: 'center', w: 700, c: C.mut, al: a[1]});
    const bmax = Math.max(0.5, ...m.loss.patch_bce_map.flat()); img(IM.set, xs[2], y, s, .8 * a[2]); heat(m.loss.patch_bce_map, xs[2], y, s, {lo: 0, hi: bmax, amax: .9, al: a[2], skip: m.mask_fed, crisp: true}); txt('patch BCE per patch', xs[2] + s / 2, y - 18, {a: 'center', w: 700, c: C.mut, al: a[2]}); txt('masked patches count 0', xs[2] + s / 2, y + s + 16, {a: 'center', s: 11, c: C.mut, al: a[2]});
    for (let k = 0; k < 3; k++) for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) if (m.mask_fed[i][j] && k > 0) { ctx.fillStyle = C.grid; ctx.globalAlpha = a[k]; ctx.fillRect(xs[k] + j * s / 16, y + i * s / 16, s / 16, s / 16); ctx.globalAlpha = 1; }
    const ba = ease(seg(t, .7, 1)), by = 340; ctx.globalAlpha = ba; const L = m.loss;
    txt('loss  =  image BCE(s, y)  +  0.5 × mean patch BCE', 20, by, {w: 700, s: 15}); txt(`=  ${sci(L.image_bce)}  +  0.5 × ${g(L.patch_bce_mean, 4)}  =  ${g(L.total, 4)}`, 20, by + 30, {w: 700, s: 18, c: C.acc}); txt(`y = ${L.y} (CHANGED), s = ${g(m.s, 2)}: the image term is ≈ 0 because the model is confident and right.`, 20, by + 62, {s: 12, c: C.mut}); ctx.globalAlpha = 1;
    txt('Frozen backbone, trainable: LoRA + head only (885,505 parameters).', 560, y + 40, {s: 12, c: C.mut, a: 'left', al: 0}); },
  real() { const m = M(), L = m.loss; return `<b>loss terms for this pair (model ${S.model}, evaluated, not training)</b>y (label_v2)           ${L.y}\ns (image logit)        ${g(m.s, 3)}\nimage BCE(s, y)        ${sci(L.image_bce)}\nmean patch BCE (kept)  ${g(L.patch_bce_mean, 5)}   over ${m.n_kept} kept patches\nlambda                 ${L.lam}\ntotal = img + lam * patch = ${sci(L.total)}\n\n<b>as in sl/train.py</b>per-image patch loss = sum(BCE * keep) / sum(keep)\nbatch 32, AdamW (head 1e-3, LoRA 2e-4), lam 0.5, bf16`; }},
 {title: 'The Second Look loop', text: 'An alarm fires, the robot pauses 10 control steps, DeltaDINO compares the settled frame with the reference, and the verdict decides: rewind and retry, or stop and flag a human.', dur: 6200,
  draw(t) { const m = M(), over = m.s >= m.threshold_logit, boxes = [[30, 'policy runs', 'SmolVLA acts'], [200, 'ALARM', 'something may have\nmoved'], [370, 'pause', '10 steps × [0,0,0,0,0,0,g]\n0.5 s, arm holds still'], [540, 'DeltaDINO', `${'4.7'} ms per pair\nreference vs settled`]];
    const y = 110, h = 90, wv = 150; boxes.forEach(([x, a, b], k) => { const on = t * 4.6 >= k; ctx.globalAlpha = on ? 1 : .25; rr(x, y, wv, h, 12, k === 1 ? C.bad + '22' : C.chip, k === 1 ? C.bad : C.acc, 2); txt(a, x + wv / 2, y + 26, {a: 'center', w: 700, s: 15, c: k === 1 ? C.bad : C.fg}); b.split('\n').forEach((l, i) => txt(l, x + wv / 2, y + 50 + i * 16, {a: 'center', s: 11, c: C.mut})); ctx.globalAlpha = 1; if (k < 3) arrow(x + wv + 2, y + h / 2, x + 168, y + h / 2, C.mut, on && t * 4.6 >= k + .6 ? 1 : 0); });
    const pa = seg(t, .5, .72); if (pa > 0) { for (let k = 0; k < 10; k++) { ctx.fillStyle = k < pa * 10 ? C.acc : C.line; ctx.fillRect(375 + k * 14, y + h + 12, 11, 8); } txt(`${Math.min(10, Math.ceil(pa * 10))}/10`, 375 + 150, y + h + 16, {s: 11, c: C.mut}); }
    const d = ease(seg(t, .72, .84)); arrow(690, y + h / 2, 760, y + h / 2, C.mut, d); ctx.globalAlpha = d; ctx.save(); ctx.translate(790, y + h / 2); ctx.rotate(Math.PI / 4); rr(-24, -24, 48, 48, 4, C.chip, C.acc, 2); ctx.restore(); txt('P ≥ thr?', 790, y + h / 2, {a: 'center', s: 11, w: 700}); ctx.globalAlpha = 1;
    const ra = ease(seg(t, .85, 1)), ok = !over; const bx1 = 520, bx2 = 710;
    arrow(780, y + h / 2 + 28, 540, 288, over ? C.ok + '55' : C.ok, ra); arrow(800, y + h / 2 + 28, 760, 288, over ? C.bad : C.bad + '55', ra);
    rr(430, 292, 220, 62, 10, C.ok + (ok ? '44' : '12'), C.ok, ok ? 3 : 1.5); txt('UNCHANGED', 540, 314, {a: 'center', w: 700, c: C.ok}); txt('safe to rewind & retry', 540, 336, {a: 'center', s: 12});
    rr(670, 292, 190, 62, 10, C.bad + (over ? '44' : '12'), C.bad, over ? 3 : 1.5); txt('CHANGED', 765, 314, {a: 'center', w: 700, c: C.bad}); txt('stop, flag human', 765, 336, {a: 'center', s: 12});
    ctx.globalAlpha = ra; txt(`this pair (model ${S.model}): P = ${g(m.P, 3)} ${over ? '≥' : '<'} ${g(m.threshold_P, 3)}  →  ${m.verdict}`, 30, 330, {w: 700, s: 15, c: over ? C.bad : C.ok}); txt('true label: CHANGED, so this is the right call.', 30, 356, {s: 13, c: C.mut}); ctx.globalAlpha = 1;
    txt('Rewinding is only safe if nothing moved: a missed change means a retry from a state that no longer exists.', 30, 420, {s: 12, c: C.mut}); },
  real() { const c = B.models.C; return `<b>this pair</b>${B.pair_id}  (true label CHANGED)\nmodel C: P ${g(c.P, 4)}   thr ${g(c.threshold_P, 3)}   ${c.verdict}\n\n<b>timing</b>pause: 10 control steps at 20 Hz = 0.5 s\nDeltaDINO: 4.7 ms per pair (batch 1, bf16)\nreference: ${B.delta} steps (0.5 s) before the alarm\n           here; Part 2 plans 10-20 steps\n\n<b>sealed-set AUROC (test_policy2, 4,147 pairs)</b>0.993`; }},
];

/* ---------------- plumbing ---------------- */
function setStep(k) { S.step = clamp(k, 0, 7); S.t = 0; S.t0 = performance.now(); S.wait = 0; render(); }
function render() { const st = STEPS[S.step]; $('#sn').textContent = `Step ${S.step + 1} of 8`; $('#st').textContent = st.title; $('#sp').textContent = st.text; $('#sr').innerHTML = st.real(); $('#back').disabled = S.step === 0; $('#next').disabled = S.step === 7;
  document.querySelectorAll('#dots button').forEach((b, i) => b.classList.toggle('on', i === S.step)); $('#patchrow').style.display = st.patches ? 'flex' : 'none';
  document.querySelectorAll('#patchrow button').forEach(b => b.classList.toggle('on', b.dataset.n === S.patch)); }
function frame(now) { colors(); const st = STEPS[S.step]; const dpr = devicePixelRatio || 1; if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); ctx.clearRect(0, 0, W, H); ctx.fillStyle = C.card; ctx.fillRect(0, 0, W, H);
  S.t = S.fixed != null ? S.fixed : clamp((now - S.t0) / st.dur); st.draw(S.t);
  if (S.auto && S.t >= 1 && S.fixed == null) { S.wait = S.wait || now; if (now - S.wait > 2500) { if (S.step < 7) setStep(S.step + 1); else setStep(0); } }
  requestAnimationFrame(frame); }
$('#back').onclick = () => setStep(S.step - 1); $('#next').onclick = () => setStep(S.step + 1); $('#replay').onclick = () => setStep(S.step);
$('#auto').onclick = () => { S.auto = !S.auto; S.wait = 0; $('#auto').textContent = 'Autoplay: ' + (S.auto ? 'on' : 'off'); $('#auto').classList.toggle('on', S.auto); };

$('#theme').onclick = () => { const r = document.documentElement, d = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = d === 'dark' ? 'light' : 'dark'; };
for (let i = 0; i < 8; i++) { const b = document.createElement('button'); b.textContent = i + 1; b.onclick = () => setStep(i); $('#dots').appendChild(b); }
NAMES.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.dataset.n = n; b.style.borderColor = PCOL[n]; b.onclick = () => { S.patch = n; S.t0 = performance.now(); render(); }; $('#patchrow').appendChild(b); });
$('#sub').textContent = `example pair ${B.pair_id} (${B.split} split): a bottle is toppled, label CHANGED  ·  model C, seed 0`;
window.addEventListener('keydown', e => { if (e.key === 'ArrowRight') setStep(S.step + 1); if (e.key === 'ArrowLeft') setStep(S.step - 1); });
setStep(S.step); requestAnimationFrame(frame);
</script>
