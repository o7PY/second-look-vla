# Publishes ONLY web/public/ to GitHub Pages (nothing else in the repo is uploaded to the site).
# Not active here: to use it, copy this file to .github/workflows/pages.yml in the repository,
# set Settings > Pages > Source to "GitHub Actions", and change `main` below if your default branch is named differently.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/public/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public
      - id: deployment
        uses: actions/deploy-pages@v4
