# OPTIONAL and currently not used: GitHub Pages publishes this repository straight from the branch
# (Settings > Pages > Deploy from a branch > main / root), where the pages live at their file paths
# (/, /part1.html, /web-study/, /transcript/) and the empty .nojekyll at the root keeps Jekyll off.
# This workflow is the alternative: it uploads only the website files (index.html, part1-4.html, assets/) plus the two
# standalone pages (web-study/index.html at /study/, transcript/index.html at /transcript/; linked from no page).
# It runs by hand only (Actions tab > Run workflow). To use it for real, set Settings > Pages > Source to "GitHub Actions"
# and add a push trigger under `on:` (see the commented lines).
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (website files only)
        run: |
          mkdir _site
          cp index.html part1.html part2.html part3.html part4.html _site/
          cp -r assets _site/assets
          # standalone pages (published at /study/ and /transcript/, linked from no page).
          # A missing file only skips that page, with a warning; it can never stop the main site from deploying.
          for pair in "web-study/index.html:study" "transcript/index.html:transcript"; do
            src="${pair%%:*}"; dir="${pair##*:}"
            if [ -f "$src" ]; then
              mkdir -p "_site/$dir" && cp "$src" "_site/$dir/index.html"
            else
              echo "::warning::$src not found, /$dir/ is not published"
            fi
          done
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
